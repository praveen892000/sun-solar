# Render Blueprint — Sri Sun Solar (Next.js + Prisma + Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# Free web services do not run Pre-Deploy Command, so migrate + seed run on start.
# Free Postgres expires after 30 days — upgrade for production.

services:
  - type: web
    name: sun-solar-web
    runtime: node
    plan: free
    region: singapore
    branch: master
    autoDeployTrigger: commit
    # Include devDependencies so TypeScript types / ESLint packages are available if needed.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sun-solar-db
          property: connectionString
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sun-solar-web.onrender.com
      - key: SEED_ADMIN_EMAIL
        value: admin@srisunsolar.com
      # Auto-generated — copy from Render Dashboard → Environment after first deploy.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_NAME
        value: Site Admin

databases:
  - name: sun-solar-db
    plan: free
    databaseName: sunsolar
    user: sunsolar
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
